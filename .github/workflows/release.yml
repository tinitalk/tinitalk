name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag and application version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fqx "val tinitalkVersionName = \"$VERSION\"" \
            android/app/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit in main"
            exit 1
          fi

  server:
    name: Test and build server and web
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        run: make web

      - name: Test web
        run: make web-test

      - name: Package web archive
        working-directory: web/dist
        run: |
          mkdir -p ../../dist
          zip -r "../../dist/tinitalk-web-$GITHUB_REF_NAME.zip" .

      - name: Test Go
        run: go test -race -count=1 -tags webui ./...

      - name: Vet Go
        run: go vet -tags webui ./...

      - name: Build Linux servers with the tested web bundle
        run: |
          make server GO_BUILD_TAGS=webui GOARCH=amd64
          make server GO_BUILD_TAGS=webui GOARCH=arm64

      - name: Upload server and web artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-web
          path: |
            dist/tinitalk-linux-amd64
            dist/tinitalk-linux-arm64
            dist/tinitalk-web-*.zip
          if-no-files-found: error
          retention-days: 3

  android:
    name: Test and build signed APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Restore Android signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          mkdir -p android/keystore

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/release.jks
          test -s android/keystore/release.jks

          {
            printf 'storeFile=keystore/release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore/release.properties

      - name: Test, lint and build verified signed APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease exportReleaseApk -PtinitalkAbi=arm64

      - name: Verify APK signature
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          EXPECTED_CERT_SHA256="${RELEASE_CERT_SHA256//:/}"
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Set GitHub variable RELEASE_CERT_SHA256 to the signing certificate SHA-256 fingerprint"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          APK="dist/tinitalk-v$VERSION.apk"
          test -f "$APK"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner -print \
              | sort -V \
              | tail -n 1
          )"
          test -x "$APKSIGNER"

          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT"

          if ! printf '%s\n' "$SIGNATURE_OUTPUT" \
            | tr -d ':' \
            | grep -Fqi "certificate SHA-256 digest $EXPECTED_CERT_SHA256"; then
            echo "::error::APK signing certificate does not match RELEASE_CERT_SHA256"
            exit 1
          fi

      - name: Remove Android signing files
        if: always()
        shell: bash
        run: |
          rm -f \
            android/keystore/release.jks \
            android/keystore/release.properties

      - name: Upload verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/tinitalk-v*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Create release draft
    needs: [server, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum \
            tinitalk-linux-amd64 \
            tinitalk-linux-arm64 \
            "tinitalk-v$VERSION.apk" \
            "tinitalk-web-v$VERSION.zip" \
            > SHA256SUMS

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "$GITHUB_REF_NAME" \
            dist/tinitalk-linux-amd64 \
            dist/tinitalk-linux-arm64 \
            "dist/tinitalk-v$VERSION.apk" \
            "dist/tinitalk-web-v$VERSION.zip" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --draft \
            --prerelease \
            --title "TiniTalk $VERSION"
